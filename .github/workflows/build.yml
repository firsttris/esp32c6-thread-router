name: Build

# Changes to documentation alone don't build.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

# A new push to a pull request cancels its outdated run; runs on main finish
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Draft pull requests do not build; "Ready for review" starts the run
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.12"

      # ESPHome is pinned in requirements.txt; the cache saves downloading and
      # building the wheels and rolls over with a new pin
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-

      - name: Install ESPHome
        id: esphome
        run: |
          pip install -r requirements.txt
          echo "version=$(esphome version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Dummy secrets: a made-up test dataset and a random key.
      # The resulting firmware is only built, never published.
      - name: Create dummy secrets
        run: |
          cat > secrets.yaml <<SECRETS
          thread_tlv: "0e080000000000010000000300000f35060004001fffe0020811111111222222220708fd8f5ea21f1d9e4a0510aabbccddeeff00112233445566778899aa030f4f70656e5468726561642d31323334010212340410aabbccddeeff00112233445566778899aa0c0402a0f7f8"
          api_encryption_key: "$(openssl rand -base64 32)"
          SECRETS

      - name: Validate config
        run: esphome config esp32c6-thread-router.yaml

      # ESPHome builds ESP-IDF natively (no PlatformIO): framework, toolchains
      # and the IDF Python env live in ~/.cache/esphome. That env links to the
      # runner's Python, so the key includes the Python and ESPHome version.
      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v6
        with:
          path: ~/.cache/esphome
          key: esphome-idf-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ steps.esphome.outputs.version }}

      # Build directory (incl. storage JSON, without which ESPHome cleans the
      # build): ninja then only recompiles what changed. secrets.yaml lives
      # next to the config, not in .esphome/, and is not cached.
      - name: Cache build directory
        uses: actions/cache@v6
        with:
          path: .esphome
          key: esphome-build-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ steps.esphome.outputs.version }}-${{ hashFiles('esp32c6-thread-router.yaml') }}
          restore-keys: esphome-build-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ steps.esphome.outputs.version }}-

      - name: Compile firmware
        run: esphome compile esp32c6-thread-router.yaml
